<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#101010" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E87532" />
      <stop offset="50%" stop-color="#F29358" />
      <stop offset="100%" stop-color="#C85D28" />
    </linearGradient>

    <linearGradient id="subtleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E87532" stop-opacity="0" />
      <stop offset="50%" stop-color="#E87532" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E87532" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.035" />
      <circle cx="28" cy="28" r="0.75" fill="#E87532" fill-opacity="0.25" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.4; transform: scale(0.98); }
    }
    .pulse {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Card Background -->
  <rect width="920" height="320" rx="16" fill="url(#bgGrad)" stroke="#262626" stroke-width="1.2" />
  
  <!-- Subtle Grid Pattern -->
  <rect width="920" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="780" cy="80" r="140" fill="#E87532" fill-opacity="0.06" filter="url(#glow)" />
  <circle cx="120" cy="240" r="100" fill="#E87532" fill-opacity="0.04" filter="url(#glow)" />

  <!-- Top Accent Highlight Bar -->
  <path d="M 16 1.2 L 904 1.2" stroke="url(#subtleLine)" stroke-width="2.4" />

  <!-- Top Metadata Coordinates -->
  <g class="mono" font-size="10.5" fill="#78716C" letter-spacing="0.5">
    <text x="36" y="38">LOC: 28.6139° N, 77.2090° E</text>
    <text x="460" y="38" text-anchor="middle">GITHUB: @arpitat09</text>
    <text x="884" y="38" text-anchor="end">SYS // DEV_ENV: PRODUCTION</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="52" x2="884" y2="52" stroke="#222222" stroke-width="1" />

  <!-- Availability Status Pill -->
  <g transform="translate(36, 72)">
    <rect width="320" height="24" rx="12" fill="#181818" stroke="#333333" stroke-width="0.8" />
    <circle cx="14" cy="12" r="4.5" fill="#10B981" />
    <circle cx="14" cy="12" r="7" fill="#10B981" fill-opacity="0.25" class="pulse" />
    <text x="28" y="16" class="mono" font-size="10.5" font-weight="600" fill="#E6E0D4" letter-spacing="0.5">
      AVAILABLE FOR SOFTWARE ROLES
    </text>
  </g>

  <!-- Eyebrow Title -->
  <text x="36" y="124" class="mono" font-size="12" font-weight="700" fill="#E87532" letter-spacing="2">
    FULL-STACK DEVELOPER  •  SOFTWARE ENGINEER
  </text>

  <!-- Main Hero Name -->
  <text x="36" y="174" class="sans" font-size="44" font-weight="800" fill="#F5F1E8" letter-spacing="-0.8">
    Arpita Tiwari
  </text>

  <!-- Subtitle / Positioning -->
  <text x="36" y="212" class="sans" font-size="16" font-weight="400" fill="#A7A29A">
    Building digital products that are <tspan fill="#F5F1E8" font-weight="600">useful</tspan>, <tspan fill="#F5F1E8" font-weight="600">scalable</tspan>, and <tspan fill="#E87532" font-weight="600">beautifully engineered</tspan>.
  </text>

  <!-- Bottom Divider Line -->
  <line x1="36" y1="244" x2="884" y2="244" stroke="#222222" stroke-width="1" />

  <!-- Bottom Tech Tags Row -->
  <g transform="translate(36, 264)" class="mono" font-size="10.5" font-weight="600">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="84" height="26" rx="6" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="42" y="17" fill="#D97736" text-anchor="middle">REACT 19</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(94, 0)">
      <rect width="98" height="26" rx="6" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="49" y="17" fill="#E6E0D4" text-anchor="middle">TYPESCRIPT</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(202, 0)">
      <rect width="78" height="26" rx="6" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="39" y="17" fill="#E6E0D4" text-anchor="middle">NODE.JS</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(290, 0)">
      <rect width="72" height="26" rx="6" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="36" y="17" fill="#E6E0D4" text-anchor="middle">PYTHON</text>
    </g>

    <!-- Tag 5 -->
    <g transform="translate(372, 0)">
      <rect width="118" height="26" rx="6" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="59" y="17" fill="#E6E0D4" text-anchor="middle">IIOT SECURITY</text>
    </g>

    <!-- Tag 6 -->
    <g transform="translate(500, 0)">
      <rect width="102" height="26" rx="6" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="51" y="17" fill="#E6E0D4" text-anchor="middle">APPLIED AI</text>
    </g>

    <!-- Right Side Signature Motif -->
    <g transform="translate(640, 0)">
      <text x="208" y="17" fill="#8C8C8C" text-anchor="end" font-size="11" letter-spacing="1">
        BUILD <tspan fill="#E87532">→</tspan> SOLVE <tspan fill="#E87532">→</tspan> LEARN <tspan fill="#E87532">→</tspan> SHIP
      </text>
    </g>
  </g>
</svg>
