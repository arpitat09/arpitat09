<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151515" />
      <stop offset="50%" stop-color="#0F0F0F" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E87532" />
      <stop offset="50%" stop-color="#F98C4E" />
      <stop offset="100%" stop-color="#C85D28" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E87532" stop-opacity="0" />
      <stop offset="20%" stop-color="#E87532" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFA875" stop-opacity="1" />
      <stop offset="80%" stop-color="#E87532" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E87532" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.035" />
      <circle cx="30" cy="30" r="0.8" fill="#E87532" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 0.9; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(0.95); }
    }
    @keyframes scanline {
      0% { transform: translateY(-10px); opacity: 0; }
      50% { opacity: 0.25; }
      100% { transform: translateY(330px); opacity: 0; }
    }
    .pulsing-dot {
      animation: pulse 2.5s ease-in-out infinite;
      transform-origin: center;
    }
    .scan {
      animation: scanline 7s linear infinite;
    }
  </style>

  <!-- Card Background -->
  <rect width="940" height="340" rx="18" fill="url(#bgGrad)" stroke="#262626" stroke-width="1.2" />
  
  <!-- Subtle Grid Pattern -->
  <rect width="940" height="340" rx="18" fill="url(#grid)" />

  <!-- Dynamic Scan Line -->
  <line x1="10" y1="0" x2="930" y2="0" stroke="#E87532" stroke-width="1.5" stroke-opacity="0.4" class="scan" />

  <!-- Ambient Color Orbs -->
  <circle cx="820" cy="90" r="160" fill="#E87532" fill-opacity="0.07" filter="url(#ambientGlow)" />
  <circle cx="100" cy="260" r="120" fill="#E87532" fill-opacity="0.05" filter="url(#ambientGlow)" />

  <!-- Top Accent Glowing Border -->
  <path d="M 18 1.5 L 922 1.5" stroke="url(#glowLine)" stroke-width="2.6" />

  <!-- Top Meta Bar -->
  <g class="mono" font-size="10.5" fill="#78716C" letter-spacing="0.5">
    <text x="36" y="38">SYS: FULL_STACK // REACT 19 // NODE</text>
    <text x="470" y="38" text-anchor="middle">LOC: 28.6139° N, 77.2090° E</text>
    <text x="904" y="38" text-anchor="end">GITHUB: @arpitat09</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="52" x2="904" y2="52" stroke="#222222" stroke-width="1" />

  <!-- Status Indicator Badge -->
  <g transform="translate(36, 74)">
    <rect width="320" height="26" rx="13" fill="#181818" stroke="#333333" stroke-width="0.8" />
    <circle cx="15" cy="13" r="5" fill="#10B981" />
    <circle cx="15" cy="13" r="8" fill="#10B981" fill-opacity="0.25" class="pulsing-dot" />
    <text x="30" y="17.5" class="mono" font-size="10.5" font-weight="600" fill="#F5F1E8" letter-spacing="0.5">
      AVAILABLE FOR SOFTWARE ROLES
    </text>
  </g>

  <!-- Eyebrow Subtitle -->
  <text x="36" y="132" class="mono" font-size="12" font-weight="700" fill="#E87532" letter-spacing="2.5">
    FULL-STACK DEVELOPER  •  SOFTWARE ENGINEER  •  SYSTEMS BUILDER
  </text>

  <!-- Main Hero Name -->
  <text x="36" y="184" class="sans" font-size="46" font-weight="800" fill="#F5F1E8" letter-spacing="-0.8">
    Arpita Tiwari
  </text>

  <!-- Positioning Statement -->
  <text x="36" y="224" class="sans" font-size="16.5" font-weight="400" fill="#A7A29A">
    Building digital products that are <tspan fill="#F5F1E8" font-weight="600">useful</tspan>, <tspan fill="#F5F1E8" font-weight="600">scalable</tspan>, and <tspan fill="#E87532" font-weight="600">beautifully engineered</tspan>.
  </text>

  <!-- Bottom Divider Line -->
  <line x1="36" y1="256" x2="904" y2="256" stroke="#222222" stroke-width="1" />

  <!-- Technical Tag Badges -->
  <g transform="translate(36, 276)" class="mono" font-size="10.5" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="88" height="28" rx="7" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="44" y="18" fill="#E87532" text-anchor="middle">REACT 19</text>
    </g>

    <g transform="translate(98, 0)">
      <rect width="102" height="28" rx="7" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="51" y="18" fill="#F5F1E8" text-anchor="middle">TYPESCRIPT</text>
    </g>

    <g transform="translate(210, 0)">
      <rect width="82" height="28" rx="7" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="41" y="18" fill="#F5F1E8" text-anchor="middle">NODE.JS</text>
    </g>

    <g transform="translate(302, 0)">
      <rect width="76" height="28" rx="7" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="38" y="18" fill="#F5F1E8" text-anchor="middle">PYTHON</text>
    </g>

    <g transform="translate(388, 0)">
      <rect width="124" height="28" rx="7" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="62" y="18" fill="#F5F1E8" text-anchor="middle">IIOT SECURITY</text>
    </g>

    <g transform="translate(522, 0)">
      <rect width="108" height="28" rx="7" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="0.8" />
      <text x="54" y="18" fill="#F5F1E8" text-anchor="middle">APPLIED AI</text>
    </g>

    <!-- Right Side Signature Motif -->
    <g transform="translate(638, 0)">
      <text x="230" y="18" fill="#8C8C8C" text-anchor="end" font-size="11" letter-spacing="1">
        BUILD <tspan fill="#E87532">→</tspan> SOLVE <tspan fill="#E87532">→</tspan> LEARN <tspan fill="#E87532">→</tspan> SHIP
      </text>
    </g>
  </g>
</svg>
